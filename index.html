<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психометрический тренажёр</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:12px}
button{padding:10px;margin:5px;cursor:pointer}
.option{display:block;width:100%;text-align:left}
.correct{background:#c8f7c5}
.incorrect{background:#f7c5c5}
.active{background:#2563eb;color:white}
.dark{background:#111;color:#eee}
.dark .container{background:#222}
</style>
</head>
<body>
<div class="container">
<h1>🧠 Психометрический тренажёр</h1>

<div>
<button onclick="setMode('practice',this)" class="active">Тренировка</button>
<button onclick="setMode('exam',this)">Экзамен</button>
<button onclick="toggleTheme()">Тема</button>
</div>

<h3 id="question"></h3>
<div id="answers"></div>
<div id="explanation"></div>

<p>Баллы: <span id="score">0</span></p>

<button onclick="prevQ()">Назад</button>
<button onclick="nextQ()">Далее</button>
</div>

<script>
const questions=[
{q:'2+2=?',a:['3','4','5','6'],c:1,e:'Правильный ответ: 4'},
{q:'10% от 200?',a:['10','20','30','40'],c:1,e:'20'},
{q:'5*5=?',a:['20','25','30','35'],c:1,e:'25'}
];

let i=0,score=0,mode='practice';

function render(){
if(i>=questions.length){
document.getElementById('question').innerHTML='Тест завершён';
document.getElementById('answers').innerHTML='';
document.getElementById('explanation').innerHTML='Итоговый балл: '+score;
return;
}
let q=questions[i];
document.getElementById('question').innerText=q.q;
let html='';
q.a.forEach((x,n)=>{
html+=`<button class="option" onclick="answer(${n})">${x}</button>`;
});
document.getElementById('answers').innerHTML=html;
document.getElementById('explanation').innerHTML='';
document.getElementById('score').innerText=score;
}

function answer(n){
let q=questions[i];
let btns=document.querySelectorAll('.option');
btns.forEach((b,k)=>{
b.disabled=true;
if(k===q.c)b.classList.add('correct');
if(k===n && k!==q.c)b.classList.add('incorrect');
});
if(n===q.c)score++;
if(mode==='practice'){
document.getElementById('explanation').innerText=q.e;
}
document.getElementById('score').innerText=score;
}

function nextQ(){i++;render();}
function prevQ(){if(i>0){i--;render();}}

function setMode(m,el){
mode=m;
document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
}

function toggleTheme(){
document.body.classList.toggle('dark');
}

render();
</script>
</body>
</html>
